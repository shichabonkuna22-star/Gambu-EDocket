services:
  - type: web
    name: gambu-edocket
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true   # Render generates a random secret
      - key: DATABASE_URL
        fromDatabase:
          name: gambu-edocket-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # You'll fill these manually in the dashboard
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: postgresql
    name: gambu-edocket-db
    plan: free   # Render's free tier
    # No database/user specified – Render will auto-generate them