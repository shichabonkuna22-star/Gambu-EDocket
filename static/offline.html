<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SAPS eDocket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .offline-box { text-align: center; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); max-width: 500px; }
        .offline-box i { font-size: 4rem; color: #dc3545; }
    </style>
</head>
<body>
    <div class="offline-box">
        <i class="fas fa-wifi-slash"></i>
        <h1 class="mt-3">You're Offline</h1>
        <p class="text-muted">Please check your internet connection. Cases you create will be saved locally and synced automatically when you're back online.</p>
        <button class="btn btn-primary mt-3" onclick="location.reload()">Try Again</button>
    </div>
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</body>
</html>
